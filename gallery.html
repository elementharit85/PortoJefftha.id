<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Jefftha</title>
  <link rel="icon" href="images/icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="transitions.css">
</head>
<body class="bg-bg text-white font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-grow max-w-6xl mx-auto w-full px-6 pt-32">
    <h1 class="text-center text-4xl md:text-5xl font-bold animate-fade-up">Gall<span class="text-rose">ery</span></h1>
    <p class="mt-3 text-center text-white/50 text-sm">Klik foto untuk memperbesar</p>

    <section class="mt-12 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <figure data-reveal class="group relative overflow-hidden rounded-2xl border border-line">
        <img data-lightbox src="images/hobi1.jpeg" alt="Main drum" class="w-full h-64 object-cover cursor-zoom-in group-hover:scale-110 transition duration-700">
        <figcaption class="absolute inset-x-0 bottom-0 p-4 text-sm bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition duration-300 pointer-events-none">Latihan bermain drum di studio musik.</figcaption>
      </figure>
      <figure data-reveal data-delay="100" class="group relative overflow-hidden rounded-2xl border border-line">
        <img data-lightbox src="images/hobi2.jpeg" alt="Main biliar bersama teman" class="w-full h-64 object-cover cursor-zoom-in group-hover:scale-110 transition duration-700">
        <figcaption class="absolute inset-x-0 bottom-0 p-4 text-sm bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition duration-300 pointer-events-none">Sesi santai bermain biliar bersama teman.</figcaption>
      </figure>
      <figure data-reveal data-delay="200" class="group relative overflow-hidden rounded-2xl border border-line">
        <img data-lightbox src="images/hobi3.jpeg" alt="Mendengarkan musik" class="w-full h-64 object-cover cursor-zoom-in group-hover:scale-110 transition duration-700">
        <figcaption class="absolute inset-x-0 bottom-0 p-4 text-sm bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition duration-300 pointer-events-none">Mendengarkan musik bikin suasana tenang.</figcaption>
      </figure>
      <figure data-reveal class="group relative overflow-hidden rounded-2xl border border-line">
        <img data-lightbox src="images/gala1.jpeg" alt="Main bareng teman" class="w-full h-64 object-cover cursor-zoom-in group-hover:scale-110 transition duration-700">
        <figcaption class="absolute inset-x-0 bottom-0 p-4 text-sm bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition duration-300 pointer-events-none">Nyantai dan main e-football bareng teman.</figcaption>
      </figure>
      <figure data-reveal data-delay="100" class="group relative overflow-hidden rounded-2xl border border-line">
        <img data-lightbox src="images/gala2.jpeg" alt="Event anak muda youth" class="w-full h-64 object-cover cursor-zoom-in group-hover:scale-110 transition duration-700">
        <figcaption class="absolute inset-x-0 bottom-0 p-4 text-sm bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition duration-300 pointer-events-none">Event anak muda (youth).</figcaption>
      </figure>
      <figure data-reveal data-delay="200" class="group relative overflow-hidden rounded-2xl border border-line">
        <img data-lightbox src="images/gala3.jpeg" alt="Event kerohanian internasional" class="w-full h-64 object-cover cursor-zoom-in group-hover:scale-110 transition duration-700">
        <figcaption class="absolute inset-x-0 bottom-0 p-4 text-sm bg-gradient-to-t from-black/90 to-transparent translate-y-full group-hover:translate-y-0 transition duration-300 pointer-events-none">Pertemuan Event Kerohanian Internasional by LevelUP.</figcaption>
      </figure>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="main.js"></script>
</body>
</html>
