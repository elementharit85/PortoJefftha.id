<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Jefftha</title>
  <link rel="icon" href="images/icon.png" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="transitions.css">
</head>
<body class="bg-bg text-white font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">
  <div id="site-header"></div>

  <main class="flex-grow max-w-5xl mx-auto w-full px-6 pt-32 text-center">
    <h1 class="text-4xl md:text-5xl font-bold animate-fade-up">Contact<span class="text-rose">ME</span></h1>
    <p class="mt-3 text-[#d1cfcf] max-w-xl mx-auto animate-fade-up" style="animation-delay:.1s">Hubungi saya melalui sosmed di bawah ini</p>

    <section class="mt-12 grid sm:grid-cols-2 md:grid-cols-3 gap-6">
      <article data-reveal class="group flex flex-col items-center p-7 rounded-2xl bg-surface/80 border border-line hover:border-rose/60 hover:-translate-y-2 hover:shadow-xl hover:shadow-rose/10 transition duration-300">
        <div class="w-16 h-16 rounded-2xl bg-white/5 p-3 group-hover:scale-110 group-hover:-rotate-6 transition"><img src="icons/icon-gmail.png" alt="Gmail" class="w-full h-full object-contain"></div>
        <h2 class="mt-4 text-xl font-semibold text-rose">Email</h2>
        <p class="mt-2 mb-5 text-[#d1cfcf] text-sm break-all">yeftaforall@gmail.com</p>
        <a href="mailto:yeftaforall@gmail.com" class="mt-auto px-5 py-2 rounded-lg border border-rose bg-line text-sm hover:bg-rose hover:text-bg transition">Kirim Email</a>
      </article>
      <article data-reveal data-delay="120" class="group flex flex-col items-center p-7 rounded-2xl bg-surface/80 border border-line hover:border-rose/60 hover:-translate-y-2 hover:shadow-xl hover:shadow-rose/10 transition duration-300">
        <div class="w-16 h-16 rounded-2xl bg-white/5 p-3 group-hover:scale-110 group-hover:-rotate-6 transition"><img src="icons/icon-whatsapp.png" alt="WhatsApp" class="w-full h-full object-contain"></div>
        <h2 class="mt-4 text-xl font-semibold text-rose">WhatsApp</h2>
        <p class="mt-2 mb-5 text-[#d1cfcf] text-sm">+62 812-4941-1003</p>
        <a href="https://wa.me/6281249411003" target="_blank" rel="noopener" class="mt-auto px-5 py-2 rounded-lg border border-rose bg-line text-sm hover:bg-rose hover:text-bg transition">Chat WA</a>
      </article>
      <article data-reveal data-delay="240" class="group flex flex-col items-center p-7 rounded-2xl bg-surface/80 border border-line hover:border-rose/60 hover:-translate-y-2 hover:shadow-xl hover:shadow-rose/10 transition duration-300 sm:col-span-2 md:col-span-1">
        <div class="w-16 h-16 rounded-2xl bg-white/5 p-3 group-hover:scale-110 group-hover:-rotate-6 transition"><img src="icons/icon-instagram.png" alt="Instagram" class="w-full h-full object-contain"></div>
        <h2 class="mt-4 text-xl font-semibold text-rose">Instagram</h2>
        <p class="mt-2 mb-5 text-[#d1cfcf] text-sm">@yefta_f.s</p>
        <a href="https://www.instagram.com/yefta_f.s" target="_blank" rel="noopener" class="mt-auto px-5 py-2 rounded-lg border border-rose bg-line text-sm hover:bg-rose hover:text-bg transition">Kunjungi Profil</a>
      </article>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="main.js"></script>
</body>
</html>
